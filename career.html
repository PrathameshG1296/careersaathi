<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Career Details - CareerSaathi</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="careers.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">Career<span>Saathi</span></a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="careers.html">Explore Careers</a>
        <a href="finder.html">Career Finder</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <section class="section" id="detail"></section>

  <footer class="footer">
    <p>CareerSaathi gives general guidance only. Always verify fees, eligibility and dates on official websites. We do not guarantee admission, jobs or salary.</p>
    <p>&copy; CareerSaathi</p>
  </footer>

  <script src="careers-data.js"></script>
  <script>
    var slug = new URLSearchParams(window.location.search).get("slug");
    var career = CAREERS.find(function (c) { return c.slug === slug; });
    var box = document.getElementById("detail");

    function listHtml(items, ordered) {
      var tag = ordered ? "ol" : "ul";
      return "<" + tag + ">" + items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</" + tag + ">";
    }

    if (!career) {
      box.innerHTML = '<a class="back-link" href="careers.html">&larr; Back to careers</a>' +
        '<div class="empty">Ye career record nahi mila.</div>';
    } else {
      document.title = career.title + " - CareerSaathi";

      var official = career.sourceUrl
        ? '<a class="btn btn-orange" href="' + career.sourceUrl + '" target="_blank" rel="noopener">Verify on official website</a>'
        : '<span class="btn btn-disabled">Official link will be added after verification</span>';

      box.innerHTML =
        '<a class="back-link" href="careers.html">&larr; Back to careers</a>' +
        '<span class="tag">' + career.category + '</span>' +
        '<span class="tag">' + career.level + '</span>' +
        '<span class="tag warn">' + career.status + '</span>' +
        '<h1 style="color:var(--blue);margin:8px 0 6px">' + career.title + '</h1>' +
        '<p style="margin-bottom:18px">' + career.summary + '</p>' +

        '<div class="detail-box"><h2>Minimum qualification</h2><p>' + career.minQualification + '</p></div>' +
        '<div class="detail-box"><h2>Duration</h2><p>' + career.duration + '</p></div>' +
        '<div class="detail-box"><h2>Estimated fees</h2><p>' + career.fee + '</p>' +
          '<p class="small">This is a general note, not an official fee list.</p></div>' +
        '<div class="detail-box"><h2>Skills needed</h2>' + listHtml(career.skills, false) + '</div>' +
        '<div class="detail-box"><h2>Possible job roles or next options</h2>' + listHtml(career.jobs, false) + '</div>' +
        '<div class="detail-box"><h2>Practical next steps</h2>' + listHtml(career.steps, true) + '</div>' +

        '<div class="detail-box"><h2>Source and verification</h2>' +
          '<p><strong>Source:</strong> ' + (career.sourceName || "Not added yet") + '</p>' +
          '<p><strong>Last verified:</strong> ' + career.lastVerified + '</p>' +
          '<p><strong>Status:</strong> ' + career.status + '</p>' +
          '<p class="small" style="margin:8px 0 14px">This is sample information. Always confirm details on the official website before making decisions.</p>' +
          official + '</div>';
    }
  </script>
</body>
</html>
