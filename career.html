<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Career Details - CareerSaathi</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="careers.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">Career<span>Saathi</span></a>
      <nav class="nav">
        <a href="index.html" data-i18n="nav_home">Home</a>
        <a href="careers.html" data-i18n="nav_explore">Explore Careers</a>
        <a href="finder.html" data-i18n="nav_finder">Career Finder</a>
        <a href="about.html" data-i18n="nav_about">About</a>
      </nav>
    </div>
  </header>

  <section class="section" id="detail"></section>

  <footer class="footer">
    <p data-i18n="footer_disclaimer">CareerSaathi gives general guidance only. Always verify fees, eligibility and dates on official websites. We do not guarantee admission, jobs or salary.</p>
    <p data-i18n="footer_copy">© CareerSaathi</p>
  </footer>

  <script src="i18n.js"></script>
  <script src="careers-data.js"></script>
  <script src="careers-hi.js"></script>
  <script src="careers-mr.js"></script>
  <script src="career-extra.js"></script>
  <script>
    var slug = new URLSearchParams(window.location.search).get("slug");
    var career = CAREERS.find(function (c) { return c.slug === slug; });
    var box = document.getElementById("detail");

    function listHtml(items, ordered) {
      var tag = ordered ? "ol" : "ul";
      return "<" + tag + ">" + items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</" + tag + ">";
    }

    function extraHtml() {
      var all = EXTRA[career.slug];
      if (!all) { return ""; }
      var ex = all[currentLang] || all.en;
      return '<div class="detail-box"><h2>' + t("extra_percent") + '</h2>' + listHtml(ex.percent, false) + '</div>' +
             '<div class="detail-box"><h2>' + t("extra_fees") + '</h2>' + listHtml(ex.fees, false) + '</div>' +
             '<div class="detail-box"><h2>' + t("extra_pay") + '</h2>' + listHtml(ex.pay, false) + '</div>' +
             '<div class="note" style="margin-bottom:16px"><strong>' + t("extra_note_title") + ':</strong> ' + ex.note + '</div>';
    }

    function renderPage() {
      if (!career) {
        document.title = "CareerSaathi";
        box.innerHTML = '<a class="back-link" href="careers.html">' + t("back") + '</a>' +
          '<div class="empty">' + t("not_found") + '</div>';
        return;
      }

      document.title = tc(career, "title") + " - CareerSaathi";

      var official = career.sourceUrl
        ? '<a class="btn btn-orange" href="' + career.sourceUrl + '" target="_blank" rel="noopener">' + t("verify_btn") + '</a>'
        : '<span class="btn btn-disabled">' + t("verify_disabled") + '</span>';

      var sourceName = tc(career, "sourceName") || t("not_added");

      box.innerHTML =
        '<a class="back-link" href="careers.html">' + t("back") + '</a>' +
        '<span class="tag">' + tc(career, "category") + '</span>' +
        '<span class="tag">' + tc(career, "level") + '</span>' +
        '<span class="tag warn">' + statusLabel(career.status) + '</span>' +
        '<h1 style="color:var(--blue);margin:8px 0 6px">' + tc(career, "title") + '</h1>' +
        '<p style="margin-bottom:18px">' + tc(career, "summary") + '</p>' +

        '<div class="detail-box"><h2>' + t("label_min_qual") + '</h2><p>' + tc(career, "minQualification") + '</p></div>' +
        extraHtml() +
        '<div class="detail-box"><h2>' + t("label_duration") + '</h2><p>' + tc(career, "duration") + '</p></div>' +
        '<div class="detail-box"><h2>' + t("label_fees") + '</h2><p>' + tc(career, "fee") + '</p>' +
          '<p class="small">' + t("fee_small") + '</p></div>' +
        '<div class="detail-box"><h2>' + t("label_skills") + '</h2>' + listHtml(tc(career, "skills"), false) + '</div>' +
        '<div class="detail-box"><h2>' + t("label_jobs") + '</h2>' + listHtml(tc(career, "jobs"), false) + '</div>' +
        '<div class="detail-box"><h2>' + t("label_steps") + '</h2>' + listHtml(tc(career, "steps"), true) + '</div>' +

        '<div class="detail-box"><h2>' + t("label_source_box") + '</h2>' +
          '<p><strong>' + t("label_source") + '</strong> ' + sourceName + '</p>' +
          '<p><strong>' + t("label_last_verified") + '</strong> ' + verifiedLabel(career.lastVerified) + '</p>' +
          '<p><strong>' + t("label_status") + '</strong> ' + statusLabel(career.status) + '</p>' +
          '<p class="small" style="margin:8px 0 14px">' + t("sample_note") + '</p>' +
          official + '</div>';
    }

    buildLangSwitcher();
    applyStatic();
    renderPage();
  </script>
</body>
</html>
