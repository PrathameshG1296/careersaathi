<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>After Class 10 - CareerSaathi</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="careers.css">
  <style>
    .block { margin-bottom: 32px; }
    .block > h2 { color: var(--blue); font-size: 1.5rem; margin-bottom: 10px; }
    .career-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .career-grid .detail-box { margin: 0; }
    .path-link { display: inline-block; margin-top: 12px; color: var(--blue); font-weight: 600; }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">Career<span>Saathi</span></a>
      <nav class="nav">
        <a href="index.html" data-i18n="nav_home">Home</a>
        <a href="careers.html" data-i18n="nav_explore">Explore Careers</a>
        <a href="finder.html" data-i18n="nav_finder">Career Finder</a>
        <a href="about.html" data-i18n="nav_about">About</a>
      </nav>
    </div>
  </header>

  <div class="page-title">
    <h1 id="p-title"></h1>
    <p id="p-sub"></p>
  </div>

  <section class="section" id="content"></section>

  <footer class="footer">
    <p data-i18n="footer_disclaimer">CareerSaathi gives general guidance only. Always verify fees, eligibility and dates on official websites. We do not guarantee admission, jobs or salary.</p>
    <p data-i18n="footer_copy">© CareerSaathi</p>
  </footer>

  <script src="i18n.js"></script>
  <script src="after10-data.js"></script>
  <script>
    function ul(items) {
      return "<ul>" + items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ul>";
    }

    function careerCard(c) {
      return '<div class="detail-box">' +
        '<h3 style="color:var(--blue);margin-bottom:8px">' + pick(c.n) + '</h3>' +
        '<p><strong>' + a10("l_route") + '</strong> ' + pick(c.r) + '</p>' +
        '<p style="margin-top:8px"><strong>' + a10("l_pay") + '</strong> ' + pick(c.p) + '</p>' +
        '</div>';
    }

    function renderPage() {
      document.title = a10("title") + " - CareerSaathi";
      document.getElementById("p-title").textContent = a10("title");
      document.getElementById("p-sub").textContent = a10("sub");

      var html =
        '<div class="note block">' + a10("disc") + '</div>' +
        '<div class="block"><h2>' + a10("hkey") + '</h2><div class="detail-box">' + ul(a10("key")) + '</div></div>' +
        '<div class="block"><h2>' + a10("h35") + '</h2><div class="detail-box">' + ul(a10("p35")) + '</div></div>' +
        '<div class="block"><h2>' + a10("hany") + '</h2><p class="sub">' + a10("any_sub") + '</p>' +
          '<div class="career-grid">' + A10_ANY.map(careerCard).join("") + '</div></div>' +
        '<h2 style="color:var(--blue);font-size:1.7rem;margin-bottom:14px">' + a10("hpaths") + '</h2>';

      A10_PATHS.forEach(function (p) {
        html += '<div class="block"><h2>' + pick(p.n) + '</h2>' +
          '<div class="note" style="margin-bottom:14px"><strong>' + a10("l_pct") + '</strong> ' + pick(p.pct) + '</div>' +
          '<div class="career-grid">' + p.careers.map(careerCard).join("") + '</div>';
        if (p.note && pick(p.note)) { html += '<p class="small" style="margin-top:10px">' + pick(p.note) + '</p>'; }
        if (p.link) { html += '<a class="path-link" href="' + p.link.href + '">' + pick(p.link.t) + ' →</a>'; }
        html += '</div>';
      });

      html += '<div class="note">' + a10("final") + '</div>';
      document.getElementById("content").innerHTML = html;
    }

    buildLangSwitcher();
    applyStatic();
    renderPage();
  </script>
</body>
</html>
