<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Career Finder - CareerSaathi</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="careers.css">
  <style>
    .q-box { background: var(--white); border: 1px solid #dde7fa; border-radius: 16px; padding: 18px; margin-bottom: 16px; }
    .q-box legend { font-weight: 700; color: var(--blue); padding: 0 6px; font-size: 1.05rem; }
    .opt { display: flex; align-items: center; gap: 10px; padding: 10px 6px; cursor: pointer; font-size: 1rem; }
    .opt input { width: 20px; height: 20px; flex-shrink: 0; }
    .err { background: #fdecea; color: #a02020; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; }
    .btn-btn { border: none; cursor: pointer; font-family: inherit; margin: 0 8px 8px 0; }
    .btn-gray { background: #e3e9f5; color: var(--blue-dark); }
    .result-card { background: var(--white); border: 1px solid #dde7fa; border-left: 6px solid var(--orange); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .result-card h3 { color: var(--blue); margin-bottom: 6px; }
    .result-card h4 { margin: 12px 0 4px; font-size: 1rem; }
    .result-card ul { padding-left: 22px; }
    .result-card li { margin-bottom: 4px; font-size: 0.97rem; }
    .also a { display: block; padding: 6px 0; color: var(--blue); font-weight: 600; }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">Career<span>Saathi</span></a>
      <nav class="nav">
        <a href="index.html" data-i18n="nav_home">Home</a>
        <a href="careers.html" data-i18n="nav_explore">Explore Careers</a>
        <a href="finder.html" data-i18n="nav_finder">Career Finder</a>
        <a href="about.html" data-i18n="nav_about">About</a>
      </nav>
    </div>
  </header>

  <div class="page-title">
    <h1 id="f-title"></h1>
    <p id="f-sub"></p>
  </div>

  <section class="section">
    <div class="note" id="f-notes" style="margin-bottom:20px"></div>
    <div id="quiz"></div>
    <div id="result"></div>
  </section>

  <footer class="footer">
    <p data-i18n="footer_disclaimer">CareerSaathi gives general guidance only. Always verify fees, eligibility and dates on official websites. We do not guarantee admission, jobs or salary.</p>
    <p data-i18n="footer_copy">© CareerSaathi</p>
  </footer>

  <script src="i18n.js"></script>
  <script src="careers-data.js"></script>
  <script src="careers-hi.js"></script>
  <script src="careers-mr.js"></script>
  <script src="finder-data.js"></script>
  <script>
    var answers = { level: "", percent: "", interest: [], budget: "", earn: "", years: "" };
    var showResult = false;
    var errorShown = false;

    function optionHtml(name, value, label, type) {
      var checked = (type === "checkbox")
        ? answers.interest.indexOf(value) !== -1
        : answers[name] === value;
      return '<label class="opt"><input type="' + type + '" name="' + name + '" value="' + value + '"' +
        (checked ? " checked" : "") + '> <span>' + label + '</span></label>';
    }

    function questionHtml(q) {
      var type = (q.type === "multi") ? "checkbox" : "radio";
      var opts = q.options.map(function (o) {
        return optionHtml(q.id, o, ft("o_" + q.id + "_" + o), type);
      }).join("");
      var optional = (q.id === "level") ? "" : ' <span class="small">' + ft("optional") + '</span>';
      var help = (q.id === "percent") ? '<p class="small">' + ft("percent_help") + '</p>' : "";
      return '<fieldset class="q-box"><legend>' + ft("q_" + q.id) + optional + '</legend>' + help + opts + '</fieldset>';
    }

    function renderQuiz() {
      var html = QUIZ_QUESTIONS.map(questionHtml).join("");
      if (errorShown) { html += '<div class="err">' + ft("err_level") + '</div>'; }
      html += '<button id="btn-show" class="btn btn-orange btn-btn">' + ft("btn_show") + '</button>' +
              '<button id="btn-reset" class="btn btn-gray btn-btn">' + ft("btn_reset") + '</button>';
      document.getElementById("quiz").innerHTML = html;
    }

    function computeResults() {
      var list = CAREERS.filter(function (c) {
        var r = QUIZ_RULES[c.slug];
        return r && r.levels.indexOf(answers.level) !== -1;
      });
      var rankMap = { short: 1, three: 2, long: 3 };

      var scored = list.map(function (c) {
        var r = QUIZ_RULES[c.slug];
        var score = 0;
        var reasons = [ft("r_level")];
        var warns = [];

        var matched = answers.interest.filter(function (i) { return r.interests.indexOf(i) !== -1; });
        if (matched.length) {
          score += 3 * matched.length;
          var names = matched.map(function (i) { return ft("o_interest_" + i); }).join(", ");
          reasons.push(ft("r_interest").replace("{x}", names));
        }
        if (answers.earn === "soon") {
          if (r.fast) { score += 2; reasons.push(ft("r_earn")); }
          else { score -= 1; warns.push(ft("w_earn")); }
        }
        if (answers.budget === "low" && r.lowCost) {
          score += 2; reasons.push(ft("r_budget"));
        }
        if (answers.years) {
          if (r.years <= rankMap[answers.years]) { score += 1; reasons.push(ft("r_years")); }
          else { score -= 2; warns.push(ft("w_years")); }
        }
        warns.push(ft("watch_" + c.slug.replace(/-/g, "_")));
        return { c: c, score: score, reasons: reasons, warns: warns };
      });

      scored.sort(function (a, b) { return b.score - a.score; });
      return scored;
    }

    function ul(items) {
      return "<ul>" + items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ul>";
    }

    function renderResult() {
      var box = document.getElementById("result");
      if (!showResult) { box.innerHTML = ""; return; }

      var scored = computeResults();
      var top = scored.slice(0, 3);
      var rest = scored.slice(3);
      var band = answers.percent || "skip";

      var html = '<h2 style="color:var(--blue);margin:24px 0 6px">' + ft("result_title") + '</h2>' +
                 '<p class="sub">' + ft("result_note") + '</p>';

      if (top.length && top[0].score < 2) {
        html += '<div class="note" style="margin-bottom:16px">' + ft("weak") + '</div>';
      }

      top.forEach(function (s) {
        html += '<div class="result-card">' +
          '<h3>' + tc(s.c, "title") + '</h3>' +
          '<span class="tag">' + tc(s.c, "category") + '</span>' +
          '<span class="tag warn">' + statusLabel(s.c.status) + '</span>' +
          '<h4>' + ft("why") + '</h4>' + ul(s.reasons) +
          '<h4>' + ft("watch") + '</h4>' + ul(s.warns) +
          '<p style="margin-top:12px"><a class="btn btn-orange" href="career.html?slug=' + s.c.slug + '">' + ft("view") + '</a></p>' +
          '</div>';
      });

      if (rest.length) {
        html += '<div class="detail-box also"><h2>' + ft("also") + '</h2>' +
          rest.map(function (s) {
            return '<a href="career.html?slug=' + s.c.slug + '">' + tc(s.c, "title") + '</a>';
          }).join("") + '</div>';
      }

      html += '<div class="detail-box"><h2>' + ft("percent_box_title") + '</h2>' +
        '<p>' + ft("band_" + band) + '</p>' +
        '<p class="small" style="margin-top:8px">' + ft("percent_caveat") + '</p></div>';

      html += '<div class="detail-box"><h2>' + ft("study_title") + '</h2>' + ul(ft("band_" + band + "_tips")) + '</div>';

      html += '<div class="note">' + ft("final_disclaimer") + '</div>';

      box.innerHTML = html;
    }

    function renderPage() {
      document.title = ft("title") + " - CareerSaathi";
      document.getElementById("f-title").textContent = ft("title");
      document.getElementById("f-sub").textContent = ft("sub");
      document.getElementById("f-notes").innerHTML = ft("disclaimer_top") + '<br><span class="small">' + ft("sample_note") + '</span>';
      renderQuiz();
      renderResult();
    }

    var quizBox = document.getElementById("quiz");

    quizBox.addEventListener("change", function (e) {
      var el = e.target;
      if (!el.name) { return; }
      if (el.type === "checkbox") {
        var idx = answers.interest.indexOf(el.value);
        if (el.checked && idx === -1) { answers.interest.push(el.value); }
        if (!el.checked && idx !== -1) { answers.interest.splice(idx, 1); }
      } else {
        answers[el.name] = el.value;
      }
    });

    quizBox.addEventListener("click", function (e) {
      if (e.target.id === "btn-show") {
        if (!answers.level) {
          errorShown = true;
          showResult = false;
          renderQuiz();
          renderResult();
          return;
        }
        errorShown = false;
        showResult = true;
        renderQuiz();
        renderResult();
        document.getElementById("result").scrollIntoView({ behavior: "smooth" });
      }
      if (e.target.id === "btn-reset") {
        answers = { level: "", percent: "", interest: [], budget: "", earn: "", years: "" };
        showResult = false;
        errorShown = false;
        renderPage();
        window.scrollTo(0, 0);
      }
    });

    buildLangSwitcher();
    applyStatic();
    renderPage();
  </script>
</body>
</html>
